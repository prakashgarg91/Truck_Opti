name: Refresh Router Lockfile

on:
  push:
    branches:
      - fix/to118-react-router-7-18-3-20260912
    paths:
      - 'frontend/package.json'
      - '.github/workflows/refresh-router-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/to118-react-router-7-18-3-20260912

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend lockfile
        run: npm install --prefix frontend --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'chore(to118): refresh React Router lockfile'
          git push origin HEAD:fix/to118-react-router-7-18-3-20260912
